pre-commit:
  commands:
    fmt:
      priority: 1
      run: bin/bit fmt
      stage_fixed: true
    comment-length:
      glob: "*.go"
      exclude: "**/*.pb.go"
      run: eval "$(bin/hermit env --activate)" && check-comment-length {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: bin/git-sv validate-commit-message --path / --file "$(realpath "{1}")" --source message

pre-push:
  commands:
    lint:
      run: eval "$(bin/hermit env --activate)" && bit lint
    test:
      run: eval "$(bin/hermit env --activate)" && bit test
