version: v2
plugins:
  - local: protoc-gen-go
    out: internal/sample/pb
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: internal/sample/pb
    # The sample services below are served only as raw HTTP JSON.
    exclude_types:
      - spectre.sample.v1.WeatherService
      - spectre.sample.v1.ForecastProviderService
    opt:
      - paths=source_relative
