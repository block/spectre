syntax = "proto3";

package spectre.coordinator.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/block/spectre/internal/coordinator/pb;coordinatorpb";

// MirrorService receives the state of each running mirror.
service MirrorService {
  // Report records the reporting mirror's quarantines. Mirrors always send their
  // whole state, so a retry or a coordinator restart loses nothing current.
  rpc Report(ReportRequest) returns (ReportResponse);
}

// QueryService answers questions about divergences for people and agents.
service QueryService {
  // ListDivergences returns quarantines, grouping identical ones across mirrors.
  rpc ListDivergences(ListDivergencesRequest) returns (ListDivergencesResponse);
}

message ReportRequest {
  Mirror mirror = 1;
}

message ReportResponse {}

// ListDivergencesRequest filters divergences. An empty filter matches every value.
message ListDivergencesRequest {
  string service = 1;
  string environment = 2;
  string revision = 3;
  string node = 4;
}

message ListDivergencesResponse {
  repeated Divergence divergences = 1;
}

// Mirror is the whole state of one mirror process.
message Mirror {
  // Instance identifies the mirror process, so a restart is a new instance.
  string instance = 1;
  string service = 2;
  string environment = 3;
  // Revision is the commit of the candidate the mirror runs.
  string revision = 4;
  repeated Source sources = 5;
}

// Source is one proxy of a mirror, such as ingress or egress.
message Source {
  string name = 1;
  // Quarantine is absent while the source has not quarantined the candidate.
  Quarantine quarantine = 2;
}

// Quarantine is why a source quarantined the candidate. It never carries
// payload values.
message Quarantine {
  google.protobuf.Timestamp since = 1;
  string kind = 2;
  // Traffic is absent when no single request caused the quarantine.
  Traffic traffic = 3;
  // Node is the migration state node that owns an ingress route.
  optional string node = 4;
  repeated string differences = 5;
  string detail = 6;
}

// Traffic identifies the request that caused a quarantine.
message Traffic {
  string direction = 1;
  string protocol = 2;
  string route = 3;
}

// Divergence groups identical quarantines of one service revision.
message Divergence {
  string service = 1;
  string environment = 2;
  string revision = 3;
  // Latest is the most recent occurrence.
  Quarantine latest = 4;
  // Mirrors counts the mirror instances that hit it.
  int64 mirrors = 5;
  google.protobuf.Timestamp first_seen = 6;
}
