syntax = "proto3";

package spectre.sample.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/block/spectre/internal/sample/pb;samplepb";

// User exercises presence, nested collections, and values that need special JSON encoding.
message User {
  string id = 1;
  string name = 2;
  optional string nickname = 3;
  repeated Role roles = 4;
  map<string, string> labels = 5;
  Profile profile = 6;
  bytes avatar = 7;
  uint64 revision = 8;
  google.protobuf.Timestamp created_at = 9;

  oneof contact {
    string email = 10;
    Phone phone = 11;
  }

  message Profile {
    repeated Address addresses = 1;
    optional bool marketing_consent = 2;
    map<string, Preference> preferences = 3;
  }
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_READER = 1;
  ROLE_EDITOR = 2;
  ROLE_ADMIN = 3;
}

message Address {
  repeated string lines = 1;
  string city = 2;
  string postal_code = 3;
  string country_code = 4;
}

message Phone {
  string country_code = 1;
  string number = 2;
  optional string extension = 3;
}

message Preference {
  oneof value {
    string text = 1;
    bool enabled = 2;
    double weight = 3;
  }
}
