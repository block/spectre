syntax = "proto3";

package spectre.sample.v1;

option go_package = "github.com/block/spectre/internal/sample/pb;samplepb";

// WeatherService types the raw HTTP JSON endpoints of a legacy weather service.
// The sample serves it only as HTTP JSON, so Spectre learns it from a descriptor set.
service WeatherService {
  // GET /api/v1/forecast
  rpc GetForecast(GetForecastRequest) returns (GetForecastResponse);
  // GET /v2/forecast
  rpc GetForecastV2(GetForecastV2Request) returns (GetForecastV2Response);
  // GET /_status
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetForecastRequest {
  string location = 1;
}

// GetForecastResponse holds a forecast or, when the request fails, an error.
message GetForecastResponse {
  Forecast forecast = 1;
  optional bool success = 2;
  optional string message = 3;
}

message GetForecastV2Request {
  string location = 1;
}

// GetForecastV2Response adds the location's active alerts, in no particular order.
message GetForecastV2Response {
  Forecast forecast = 1;
  repeated Alert alerts = 2;
  optional bool success = 3;
  optional string message = 4;
}

message GetStatusRequest {}

message GetStatusResponse {
  string status = 1;
  string revision = 2;
  optional string message = 3;
}

message Forecast {
  string location = 1;
  repeated DailyForecast days = 2;
}

message DailyForecast {
  string date = 1;
  Temperature high = 2;
  Temperature low = 3;
  int32 precipitation_percent = 4;
  Wind wind = 5;
}

message Temperature {
  double degrees = 1;
  string unit = 2;
}

message Wind {
  double speed_kph = 1;
  string direction = 2;
}

message Alert {
  string id = 1;
  string severity = 2;
  string headline = 3;
}
