name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # ratchet:cashapp/activate-hermit@v1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # ratchet:docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # ratchet:docker/setup-buildx-action@v4
      - name: Create release tag
        id: release
        run: |
          version="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          if [[ -z "$version" ]]; then
            next_version="$(git-sv next-version)"
            if [[ -z "$next_version" ]]; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version="v$next_version"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$version" --message "Release $version"
            git push origin "refs/tags/$version"
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Log in to Docker Hub
        env:
          DOCKER_HUB_PUSH_TOKEN: ${{ secrets.DOCKER_HUB_PUSH_TOKEN }}
        run: echo "$DOCKER_HUB_PUSH_TOKEN" | docker login --username blockossreleases --password-stdin
      - name: Publish container images
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: publish-container-images "$VERSION"
      - name: Create GitHub release
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            notes_file="$RUNNER_TEMP/release-notes.md"
            release-notes "$VERSION" > "$notes_file"
            gh release create "$VERSION" --title "$VERSION" --notes-file "$notes_file" --verify-tag
          fi
