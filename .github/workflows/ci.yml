name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Fills the day's build cache on main just after the cache keys' Sydney date
  # changes, so the first branch builds each day do not start empty. Off the
  # hour, when GitHub delays scheduled runs most.
  schedule:
    - cron: "15 0 * * *"
      timezone: "Australia/Sydney"

permissions:
  contents: read

env:
  # Bit's build cache, Go's build and module caches, and tsk's lint results,
  # at their Linux defaults.
  BUILD_CACHE_PATHS: |
    ~/.cache/bit
    ~/.cache/go-build
    ~/.cache/tsk
    ~/go/pkg/mod

# Only main saves the build cache, so every branch restores main's latest
# entry and branches never evict it with entries nothing else reads. Keys
# include the Sydney date and never fall back to an earlier day, so the cache
# starts empty each day instead of accumulating old builds. The date changes
# at midnight in Sydney, outside working hours, rather than mid-morning at
# the UTC date change.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # ratchet:cashapp/activate-hermit@v1
      - id: cache-day
        run: echo "day=$(TZ=Australia/Sydney date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: build-test-${{ steps.cache-day.outputs.day }}-${{ github.sha }}
          restore-keys: build-test-${{ steps.cache-day.outputs.day }}-
      - name: Run tests
        run: bit test
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: build-test-${{ steps.cache-day.outputs.day }}-${{ github.sha }}

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # ratchet:cashapp/activate-hermit@v1
      - id: cache-day
        run: echo "day=$(TZ=Australia/Sydney date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # Reads the Test job's cache, which holds most of the packages these
      # tests compile. Only the Test job saves it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: build-test-${{ steps.cache-day.outputs.day }}-${{ github.sha }}
          restore-keys: build-test-${{ steps.cache-day.outputs.day }}-
      - name: Run integration tests
        run: bit test-integration

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # ratchet:cashapp/activate-hermit@v1
      - id: cache-day
        run: echo "day=$(TZ=Australia/Sydney date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: build-lint-${{ steps.cache-day.outputs.day }}-${{ github.sha }}
          restore-keys: build-lint-${{ steps.cache-day.outputs.day }}-
      - name: Run lint checks
        run: bit lint
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: build-lint-${{ steps.cache-day.outputs.day }}-${{ github.sha }}

  container:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # ratchet:cashapp/activate-hermit@v1
      - id: cache-day
        run: echo "day=$(TZ=Australia/Sydney date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # Reads the Test job's cache, so building the images' binaries reuses its
      # compiled Go packages. Only the Test job saves it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: build-test-${{ steps.cache-day.outputs.day }}-${{ github.sha }}
          restore-keys: build-test-${{ steps.cache-day.outputs.day }}-
      - name: Build and test container
        run: bit test-container
      - name: Build demo container
        run: bit demo
