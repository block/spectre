imports = ["github.com/alecthomas/tsk//linters"]

disable-all = true
enable = [
  'architecture',
  'asasalint',
  'asciicheck',
  'bidichk',
  'bodyclose',
  'canonicalheader',
  'commentlength',
  'configdefaults',
  'copyloopvar',
  'dupl',
  'durationcheck',
  'encapsulation',
  'errcheck',
  'errname',
  'errorlint',
  'exhaustive',
  'exptostd',
  'fatcontext',
  'forbidigo',
  'funcorder',
  'funlen',
  'gocheckcompilerdirectives',
  'gochecknoglobals',
  'goconst',
  'godoclint',
  'godot',
  'gomoddirectives',
  'goprintffuncname',
  'iface',
  'inamedparam',
  'ineffassign',
  'intrange',
  'iotamixing',
  'kongembed',
  'konghelp',
  'layout',
  'lockguard',
  'loggercheck',
  'makezero',
  'methodfile',
  'mirror',
  'nakedret',
  'narrowdeps',
  'nilerr',
  'nilnesserr',
  'nilnil',
  'noctx',
  'nosprintfhostport',
  'optionalnil',
  'optionalstyle',
  'perfsprint',
  'predeclared',
  'promlinter',
  'protogetter',
  'publicapi',
  'reassign',
  'recvcheck',
  'revive',
  'rowserrcheck',
  'singleusestruct',
  'spancheck',
  'sqlclosecheck',
  'sumtype',
  'testableexamples',
  'testpackage',
  'tparallel',
  'typeboundary',
  'unconvert',
  'unparam',
  'unused',
  'usestdlibvars',
  'usetesting',
  'wastedassign',
  'whitespace',
  'wrapcheck',
  'govet',
  'atomicalign',
  'deepequalerrors',
  'nilness',
  'reflectvaluecompare',
  'shadow',
  'sortslice',
  'unusedwrite',
]
skip-tests = [
  'bodyclose',
  'dupl',
  'errcheck',
  'funlen',
  'goconst',
  'godot',
  'noctx',
  'wrapcheck',
  'gochecknoglobals',
  'methodfile',
]

# golangci-lint's std-error-handling preset: these errors rarely need handling.
[[exclude]]
linters = ['errcheck']
text = 'Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print(f|ln)?|os\.(Un)?Setenv). is not checked'

[[exclude]]
linters = ['gomoddirectives']
path = '^go\.mod$'
text = 'local replacement are not allowed: github\.com/microsoft/TypeScript/tsc/shim/typescript'

[[exclude]]
linters = ['godot']
source = 'TODO'

[[exclude]]
linters = ['revive']
text = 'should have a package comment'

[[exclude]]
linters = ['revive']
text = 'exported \S+ \S+ should have comment( \(or a comment on this block\))? or be unexported'

[[exclude]]
linters = ['revive']
source = '// ?(nolint|TODO)'
text = 'package comment should be of the form ".+"'

[[exclude]]
linters = ['revive']
source = '// ?(nolint|TODO)'
text = 'comment on exported \S+ \S+ should be of the form ".+"'

[[exclude]]
linters = ['shadow']
text = 'declaration of "(err|logger)" shadows declaration'

[[exclude]]
linters = ['revive']
path = '(internal/httputil/|internal/metrics/)'
text = 'avoid package names that conflict with Go standard library'

[[exclude]]
linters = ['forbidigo']
path = '_test\.go'
text = 'MustGet'

[[exclude]]
linters = ['forbidigo']
path = '_test\.go$'
text = 'Use math/rand/v2 instead'

[[exclude]]
linters = ['forbidigo']
path = '(^|/)main\.go$'
text = 'Use log/slog instead'

# Main entry points construct the logger, and internal/logger implements construction.
[[exclude]]
linters = ['forbidigo']
path = '((^|/)main\.go|^spectre\.go|^internal/logger/logger\.go|_test\.go)$'
text = 'Construct loggers only in main entry points'

[cyclop]
max-complexity = 30
package-average = 10.0

[embeddedstructfieldcheck]
forbid-mutex = true

[errcheck]
check-blank = true

[exhaustive]
check = ['switch', 'map']

[exhaustruct]
allow-empty-returns = true

[forbidigo]
analyze-types = true
exclude-godoc-examples = true

[[forbidigo.forbid]]
msg = 'Use github.com/alecthomas/errors.Errorf instead'
pattern = '^fmt\.Errorf$'
pkg = '^fmt$'

[[forbidigo.forbid]]
msg = 'Use github.com/alecthomas/errors instead'
pkg = '^errors$'

[[forbidigo.forbid]]
msg = 'Use Get or Default and handle the absent case instead of MustGet'
pattern = '\.MustGet$'
pkg = '^github\.com/alecthomas/types/optional$'

[[forbidigo.forbid]]
msg = 'Read environment variables through Kong env tags instead'
pattern = '^(os|syscall)\.(Getenv|LookupEnv|Environ|ExpandEnv|Setenv|Unsetenv|Clearenv)$'
pkg = '^(os|syscall)$'

[[forbidigo.forbid]]
msg = 'Construct loggers only in main entry points; use logger.FromContext instead'
pattern = '^slog\.(New|NewJSONHandler|NewTextHandler)$'
pkg = '^log/slog$'

[[forbidigo.forbid]]
msg = 'Construct loggers only in main entry points; use logger.FromContext instead'
pattern = '^logger\.New$'
pkg = '^github\.com/block/spectre/internal/logger$'

[[forbidigo.forbid]]
msg = 'Construct loggers only in main entry points; use logger.FromContext instead'
pattern = '^tint\.NewTextHandler$'
pkg = '^github\.com/lmittmann/tint$'

[[forbidigo.forbid]]
msg = 'Use github.com/alecthomas/errors instead'
pkg = '^github\.com/pkg/errors$'

[[forbidigo.forbid]]
msg = 'Use google.golang.org/protobuf instead, see https://developers.google.com/protocol-buffers/docs/reference/go/faq#modules'
pkg = '^github\.com/golang/protobuf(/|$)'

[[forbidigo.forbid]]
msg = "Use github.com/google/uuid instead, satori's package is not maintained"
pkg = '^github\.com/satori/go\.uuid(/|$)'

[[forbidigo.forbid]]
msg = 'Use github.com/gofrs/uuid/v5 or later, it was not a go module before v5'
pkg = '^github\.com/gofrs/uuid$'

[[forbidigo.forbid]]
msg = 'Use github.com/alecthomas/assert/v2 instead'
pkg = '^github\.com/stretchr/testify(/|$)'

[[forbidigo.forbid]]
msg = 'Use math/rand/v2 instead, see https://go.dev/blog/randv2'
pkg = '^math/rand$'

[[forbidigo.forbid]]
msg = 'Use log/slog instead, see https://go.dev/blog/slog'
pkg = '^log$'

[[forbidigo.forbid]]
msg = 'Use errors.AsType[T] instead'
pkg = '^github.com/alecthomas/errors$'
pattern = '^errors\.As$'

[funcorder]
struct-method = false

[funlen]
lines = 250
statements = 50

[gocognit]
min-complexity = 20

[godoclint]
enable = ['no-unused-link']

[inamedparam]
skip-single-param = false

[nakedret]
max-func-lines = 0

[nolintlint]
allow-no-explanation = ['funlen', 'gocognit', 'golines']
require-explanation = true
require-specific = true

[perfsprint]
strconcat = false

[reassign]
patterns = ['.*']

[shadow]
strict = true

[dot_imports]
allowed-packages = ['github.com/alecthomas/types/optional']

[rowserrcheck]
packages = ['github.com/jmoiron/sqlx']

[usetesting]
os-temp-dir = true

[wrapcheck]
ignore-package-globs = ['github.com/alecthomas/errors']

[encapsulation]
allow-generated-construction = true

[layout]
# The module root is the public API for custom binaries, and spectrepb is the
# public API of the SPECTRE server. The TypeScript shim is a
# separate module whose path mimics TypeScript's own.
allow = [
  "github.com/block/spectre",
  "github.com/block/spectre/spectrepb",
  "github.com/block/spectre/spectrepb/spectrepbconnect",
  "github.com/microsoft/TypeScript/tsc/shim/typescript",
]
