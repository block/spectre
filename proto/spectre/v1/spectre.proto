syntax = "proto3";

package spectre.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/block/spectre/spectrepb;spectrepb";

// SpectreService collects the state of running mirrors and answers questions
// about them for people and agents.
service SpectreService {
  // Update streams a mirror's state for as long as the mirror runs. Each
  // stream begins with the whole state, then changes it or keeps it alive.
  rpc Update(stream UpdateRequest) returns (UpdateResponse);
  // ListDivergences returns the state of each mirror the server still
  // considers current, and the latest divergence each mirror reported.
  rpc ListDivergences(ListDivergencesRequest) returns (ListDivergencesResponse);
  // ClearDivergences removes the divergences of one service environment, and
  // ignores quarantines that began before it.
  rpc ClearDivergences(ClearDivergencesRequest) returns (ClearDivergencesResponse);
}

// Direction names the proxy that carries traffic.
enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  // Requests to the proxied service.
  DIRECTION_INGRESS = 1;
  // Requests from the service to a dependency.
  DIRECTION_EGRESS = 2;
}

message UpdateRequest {
  oneof update {
    // State replaces the mirror's whole state. Every stream begins with it.
    State state = 1;
    // Quarantine adds the quarantine of its direction to the state.
    Quarantine quarantine = 2;
    // Keepalive shows the mirror still runs when nothing has changed.
    Keepalive keepalive = 3;
    // Calls replaces the state's call counts.
    Calls calls = 4;
  }
}

// Keepalive carries nothing; it only keeps a quiet stream alive.
message Keepalive {}

message UpdateResponse {}

// ListDivergencesRequest filters mirror states and divergences. An unset filter
// matches every value.
message ListDivergencesRequest {
  optional string service = 1;
  optional string environment = 2;
  optional string revision = 3;
  // Node matches only quarantines on routes of that migration state node.
  optional string node = 4;
}

message ListDivergencesResponse {
  repeated State states = 1;
  repeated Divergence divergences = 2;
}

// ClearDivergencesRequest names the service environment whose divergences to clear.
message ClearDivergencesRequest {
  string service = 1;
  string environment = 2;
}

message ClearDivergencesResponse {}

// Divergence is the latest quarantine of one direction of a service
// environment's mirror. It outlives the mirror run that reported it.
message Divergence {
  string service = 1;
  string environment = 2;
  // Revision is the commit of the candidate the mirror ran.
  string revision = 3;
  Quarantine quarantine = 4;
}

// Quarantine is why a proxy quarantined the candidate. It never carries
// payload values.
message Quarantine {
  // Kind is why the proxy quarantined the candidate.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // The candidate's responses differ from the reference's.
    KIND_DIVERGENT = 1;
    // The mirror could not compare or replay traffic.
    KIND_UNABLE = 2;
    // The candidate made a dependency request the reference did not.
    KIND_UNMATCHED = 3;
    // An ingress route is in no node of the migration state.
    KIND_UNLISTED = 4;
    // Candidate work exceeded a concurrency or buffer limit.
    KIND_CAPACITY = 5;
    // The mirror could not pair candidate and reference traffic.
    KIND_PAIRING = 6;
  }

  google.protobuf.Timestamp since = 1;
  Kind kind = 2;
  // Traffic is absent when no single request caused the quarantine.
  Traffic traffic = 3;
  // Node is the migration state node that owns an ingress route.
  optional string node = 4;
  reserved 5;
  string detail = 6;
  // Direction is the proxy that quarantined the candidate.
  Direction direction = 7;
  // Differences are where and how a divergent candidate's response differs.
  repeated Difference differences = 8;
  // Truncated means the responses had more differences than are listed.
  bool truncated = 9;
}

// Difference is where and how a candidate's response differs from the reference's.
// It names only schema fields, JSON types and statuses, never payload values.
message Difference {
  // Change is how the candidate's value at the path differs.
  enum Change {
    CHANGE_UNSPECIFIED = 0;
    // The reference has a value at the path and the candidate does not.
    CHANGE_MISSING = 1;
    // The candidate has a value at the path and the reference does not.
    CHANGE_ADDED = 2;
    // Both have values of the same JSON type that differ.
    CHANGE_CHANGED = 3;
    // Both have values, of different JSON types.
    CHANGE_RETYPED = 4;
  }

  // Path names declared fields; payload keys and merged list indexes are [*].
  string path = 1;
  Change change = 2;
  // Reference and candidate types are set only when the change is retyped.
  JSONType reference_type = 3;
  JSONType candidate_type = 4;
  // Count is how many keys or list elements the path stands for.
  uint32 count = 5;
  // Statuses are set only for a difference in the response status.
  Statuses statuses = 6;
}

// Statuses are the response statuses of a status difference. A protocol's
// status is a fixed code, such as "200" or "grpc-status 13", never payload.
message Statuses {
  string reference = 1;
  string candidate = 2;
}

// JSONType is the type of a JSON value.
enum JSONType {
  JSON_TYPE_UNSPECIFIED = 0;
  JSON_TYPE_NULL = 1;
  JSON_TYPE_BOOLEAN = 2;
  JSON_TYPE_NUMBER = 3;
  JSON_TYPE_STRING = 4;
  JSON_TYPE_OBJECT = 5;
  JSON_TYPE_LIST = 6;
}

// Traffic identifies the request that caused a quarantine.
message Traffic {
  Direction direction = 1;
  // Protocol is open-ended, because custom binaries may add protocols.
  string protocol = 2;
  string route = 3;
}

// State is what the mirror of one service environment runs and holds.
message State {
  string service = 1;
  string environment = 2;
  // Revision is the commit of the candidate the mirror runs.
  string revision = 3;
  // SpectreVersion is the version of SPECTRE the mirror runs.
  string spectre_version = 4;
  // Uptime is how long the mirror has run. Quarantine lasts until the mirror
  // restarts, so a mirror holding no quarantine has been healthy this long.
  google.protobuf.Duration uptime = 5;
  // Quarantines holds at most one quarantine per direction.
  repeated Quarantine quarantines = 6;
  Calls calls = 7;
}

// Calls counts the requests the mirror's ingress proxy received on each route
// since the mirror started.
message Calls {
  // Routes maps each route to its number of requests.
  map<string, uint64> routes = 1;
  // Other counts requests to routes beyond the most a mirror counts.
  uint64 other = 2;
}
