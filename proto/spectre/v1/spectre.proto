syntax = "proto3";

package spectre.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/block/spectre/spectrepb;spectrepb";

// SpectreService collects the state of running mirrors and answers questions
// about them for people and agents.
service SpectreService {
  // Heartbeat replaces the state of a service environment's mirror. A mirror
  // sends one periodically and whenever its candidate is quarantined.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // ListDivergences returns the state of each mirror the server still
  // considers current, and the latest divergence each mirror reported.
  rpc ListDivergences(ListDivergencesRequest) returns (ListDivergencesResponse);
  // ClearDivergences removes the divergences of one service environment, and
  // ignores quarantines that began before it.
  rpc ClearDivergences(ClearDivergencesRequest) returns (ClearDivergencesResponse);
}

// Direction names the proxy that carries traffic.
enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  // Requests to the proxied service.
  DIRECTION_INGRESS = 1;
  // Requests from the service to a dependency.
  DIRECTION_EGRESS = 2;
}

message HeartbeatRequest {
  State state = 1;
}

message HeartbeatResponse {}

// ListDivergencesRequest filters mirror states and divergences. An unset filter
// matches every value.
message ListDivergencesRequest {
  optional string service = 1;
  optional string environment = 2;
  optional string revision = 3;
  // Node matches only quarantines on routes of that migration state node.
  optional string node = 4;
}

message ListDivergencesResponse {
  repeated State states = 1;
  repeated Divergence divergences = 2;
}

// ClearDivergencesRequest names the service environment whose divergences to clear.
message ClearDivergencesRequest {
  string service = 1;
  string environment = 2;
}

message ClearDivergencesResponse {}

// Divergence is the latest quarantine of one direction of a service
// environment's mirror. It outlives the mirror run that reported it.
message Divergence {
  string service = 1;
  string environment = 2;
  // Revision is the commit of the candidate the mirror ran.
  string revision = 3;
  Quarantine quarantine = 4;
}

// Quarantine is why a proxy quarantined the candidate. It never carries
// payload values.
message Quarantine {
  // Kind is why the proxy quarantined the candidate.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // The candidate's responses differ from the reference's.
    KIND_DIVERGENT = 1;
    // The mirror could not compare or replay traffic.
    KIND_UNABLE = 2;
    // The candidate made a dependency request the reference did not.
    KIND_UNMATCHED = 3;
    // An ingress route is in no node of the migration state.
    KIND_UNLISTED = 4;
    // Candidate work exceeded a concurrency or buffer limit.
    KIND_CAPACITY = 5;
    // The mirror could not pair candidate and reference traffic.
    KIND_PAIRING = 6;
  }

  google.protobuf.Timestamp since = 1;
  Kind kind = 2;
  // Traffic is absent when no single request caused the quarantine.
  Traffic traffic = 3;
  // Node is the migration state node that owns an ingress route.
  optional string node = 4;
  repeated string differences = 5;
  string detail = 6;
  // Direction is the proxy that quarantined the candidate.
  Direction direction = 7;
}

// Traffic identifies the request that caused a quarantine.
message Traffic {
  Direction direction = 1;
  // Protocol is open-ended, because custom binaries may add protocols.
  string protocol = 2;
  string route = 3;
}

// State is what the mirror of one service environment runs and holds.
message State {
  string service = 1;
  string environment = 2;
  // Revision is the commit of the candidate the mirror runs.
  string revision = 3;
  // SpectreVersion is the version of SPECTRE the mirror runs.
  string spectre_version = 4;
  // Uptime is how long the mirror has run. Quarantine lasts until the mirror
  // restarts, so a mirror holding no quarantine has been healthy this long.
  google.protobuf.Duration uptime = 5;
  // Quarantines holds at most one quarantine per direction.
  repeated Quarantine quarantines = 6;
}
